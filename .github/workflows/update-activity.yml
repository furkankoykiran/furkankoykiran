name: Update Recent GitHub Activity

# This schedule stopped firing on 2026-07-03 and nobody noticed for two months.
#
# GitHub disables scheduled workflows in PUBLIC repositories after 60 days with
# no repository activity, and a push made with the default GITHUB_TOKEN does not
# count as activity. So this workflow committed to README.md roughly daily,
# looked busy, and was counted as idle the whole time. The clock ran out 57 days
# after the last human commit (2026-05-07), and the README has been frozen at
# "Jun 16" ever since.
#
# Two things keep it alive now: pushing with a PAT when one is configured, so
# the bot's own commits reset the activity clock, and a cadence that matches how
# often the content actually changes.

on:
  schedule:
    # Once a day. Hourly was 24 dispatches for a file that changed on four days
    # in all of June, and GitHub was already dropping most of them (observed
    # starts drifted 06:59 -> 13:57 UTC).
    - cron: '20 5 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit and push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # ACTIVITY_PAT is a fine-grained PAT with Contents: read and write on
          # this repository. With it, the push below is attributed to a real
          # user and counts as repository activity, so the 60-day inactivity
          # clock never runs out. Without it this falls back to GITHUB_TOKEN and
          # keeps working — it just goes back to needing a human commit every
          # couple of months to stay scheduled.
          token: ${{ secrets.ACTIVITY_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update README with recent activity
        run: node update-activity.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is unchanged; nothing to push."
            exit 0
          fi
          if [ -n "${ACTIVITY_PAT:-}" ]; then
            git config --local user.email "furkankoykiran@gmail.com"
            git config --local user.name "Furkan Köykıran"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
          fi
          git add README.md
          git commit -m "chore: update recent GitHub activity [skip ci]"
          git push
        env:
          ACTIVITY_PAT: ${{ secrets.ACTIVITY_PAT }}

      - name: Warn when the schedule is running on borrowed time
        env:
          ACTIVITY_PAT: ${{ secrets.ACTIVITY_PAT }}
        run: |
          if [ -z "${ACTIVITY_PAT:-}" ]; then
            echo "::warning::ACTIVITY_PAT is not set, so pushes from this workflow do not count as repository activity. GitHub disables a public repository's schedules after 60 days without any — which is exactly what happened here between 2026-07-03 and 2026-09-07. Add a fine-grained PAT with Contents: read and write as the ACTIVITY_PAT secret."
          fi
